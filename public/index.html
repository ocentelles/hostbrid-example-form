<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Buzón de ensayo · Formulario local</title><meta name="description" content="Formulario original que valida sin enviar correo ni guardar contactos."><link rel="stylesheet" href="/form.css"><script src="/form.js" defer></script></head><body><main><header><p class="eyebrow">BUZÓN / DEMO ORIGINAL</p><span>Entrega desactivada</span></header><section><div><h1>Un formulario.<br>Una respuesta clara.</h1><p>Prueba la validación con datos ficticios. Este ensayo no envía correo ni guarda tu mensaje.</p></div><img src="/envelope.svg" alt="Un sobre con una señal de comprobación" width="160" height="140"></section><form id="contact"><label>Nombre ficticio<input name="name" autocomplete="off" minlength="2" maxlength="80" required></label><label>Correo ficticio<input name="email" type="email" autocomplete="off" maxlength="254" placeholder="demo@example.invalid" required></label><label>Mensaje de prueba<textarea name="message" minlength="10" maxlength="1000" rows="4" required></textarea></label><div class="trap" aria-hidden="true"><label>Dejar vacío<input name="website" tabindex="-1" autocomplete="off"></label></div><button type="submit">Comprobar formulario</button><p id="result" role="status" aria-live="polite">La confirmación será local. Ningún correo saldrá de esta demo.</p></form><footer>JSON · máximo 4 KiB · cinco intentos por minuto · sin CAPTCHA</footer></main></body></html>
